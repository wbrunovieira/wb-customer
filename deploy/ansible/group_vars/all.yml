# Aplicação
app_name: wb-customer
app_domain: customer.wbdigitalsolutions.com
app_dir: /opt/wb-customer

# ── Portas ────────────────────────────────────────────────────────────────────
# O servidor é compartilhado e está cheio. Levantamento em 08/09/2026 das portas
# já em escuta: 22 25 53 80 443 3000 3001 3002 3003 3004 3010 3334-3337 5433
# 5435 5436 5678 6381 8000 8001 8010 8080 8090 9090-9092.
#
# O WB-crm usa 3000 (Next sob PM2), 3001 e 3010 (backend em Docker) e 5433
# (Postgres). A 3010 foi a armadilha: parecia livre pela documentação daquele
# projeto e não estava. O preflight agora confere as portas reais do servidor,
# em vez de comparar com uma lista escrita à mão. Ver issue #1639.
frontend_port: 3020
backend_port: 3021
db_port: 5434

# ── Banco ─────────────────────────────────────────────────────────────────────
# Instância própria, separada da do CRM: isola falha, backup e upgrade.
db_dir: /opt/wb-customer-db
db_container: wb_customer_postgres
db_name: wb_customer
db_user: wb_customer
db_password: "{{ vault_db_password }}"

# ── Repositório ───────────────────────────────────────────────────────────────
# Alias de SSH definido em /root/.ssh/config no servidor, amarrado à deploy key
# somente-leitura (/root/.ssh/wb_customer_deploy). A identidade padrão do root
# também alcança o repositório, mas com permissão de escrita em tudo — o deploy
# só precisa ler.
github_repo: git@github.com-wb-customer:wbrunovieira/wb-customer.git
github_branch: main

node_version: "22"

# ── Aplicação ─────────────────────────────────────────────────────────────────
# O frontend fala com o backend pelo MESMO domínio, sob /api/v1, roteado pelo
# nginx. Essa escolha não é livre: o redirect URI já registrado no Google Cloud
# Console é https://customer.wbdigitalsolutions.com/api/v1/google/callback.
# Trocar para um subdomínio próprio exige reregistrar lá. Ver issue #1641.
public_api_url: "https://{{ app_domain }}"

jwt_secret: "{{ vault_jwt_secret }}"
seed_admin_email: bruno@wbdigitalsolutions.com
seed_admin_password: "{{ vault_seed_admin_password }}"

# Adapters — em produção ambos usam o Google de verdade.
storage_adapter: google-drive
calendar_adapter: google-calendar

google_client_id: "{{ vault_google_client_id }}"
google_client_secret: "{{ vault_google_client_secret }}"
google_redirect_uri: "https://{{ app_domain }}/api/v1/google/callback"

# Integrações
transcriptor_base_url: "https://transcritor.wbdigitalsolutions.com"
transcriptor_api_key: "{{ vault_transcriptor_api_key }}"
meta_system_user_token: "{{ vault_meta_system_user_token }}"
meta_mock_mode: "false"
evolution_api_url: "{{ vault_evolution_api_url }}"
evolution_api_key: "{{ vault_evolution_api_key }}"
evolution_instance: "{{ vault_evolution_instance }}"

# Segurança interna
cron_secret: "{{ vault_cron_secret }}"
internal_api_key: "{{ vault_internal_api_key }}"

# Certbot — emissão por DNS-01, porque o UFW só aceita 80/443 vindos da
# Cloudflare e a emissão via HTTP não fecha num domínio novo. Ver o role nginx.
certbot_email: bruno@wbdigitalsolutions.com
cloudflare_api_token: "{{ vault_cloudflare_api_token }}"

# Preflight: build de Next + imagem Docker não cabe em pouco espaço.
min_free_gb: 5
