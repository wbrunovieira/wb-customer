---
- name: Instalar nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Diretório do webroot do certbot
  ansible.builtin.file:
    path: /var/www/html
    state: directory
    mode: "0755"

- name: Certificado já existe?
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ app_domain }}/fullchain.pem"
  register: ssl_cert

# ── Primeiro certificado ──────────────────────────────────────────────────────
# O vhost final referencia arquivos de certificado; se eles não existirem ainda,
# o `nginx -t` falha e o certbot nunca chega a rodar. Por isso o HTTP puro primeiro.
- name: Vhost temporário só com HTTP, para o desafio do certbot
  ansible.builtin.copy:
    dest: "/etc/nginx/sites-available/{{ app_name }}.conf"
    mode: "0644"
    content: |
      server {
          listen 80;
          server_name {{ app_domain }};
          location /.well-known/acme-challenge/ { root /var/www/html; }
          location / { return 200 'aguardando certificado'; add_header Content-Type text/plain; }
      }
  when: not ssl_cert.stat.exists

- name: Habilitar o site
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ app_name }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ app_name }}.conf"
    state: link

- name: Recarregar nginx para o desafio
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
  when: not ssl_cert.stat.exists

- name: Emitir o certificado
  # Requer o DNS já apontando para este servidor. Se o registro ainda estiver na
  # Vercel, o desafio falha aqui — ver issue #1640.
  ansible.builtin.command: >
    certbot certonly --webroot -w /var/www/html
    -d {{ app_domain }}
    --non-interactive --agree-tos --email {{ certbot_email }}
  when: not ssl_cert.stat.exists
  timeout: 300

# ── Vhost definitivo ──────────────────────────────────────────────────────────
- name: Escrever o vhost com TLS e o roteamento de /api/v1
  ansible.builtin.template:
    src: site.conf.j2
    dest: "/etc/nginx/sites-available/{{ app_name }}.conf"
    mode: "0644"
  notify: reload nginx

- name: Validar a configuração
  ansible.builtin.command: nginx -t
  register: nginx_test
  changed_when: false

- name: Resultado
  ansible.builtin.debug:
    msg: "{{ nginx_test.stderr_lines | default([]) }}"
