---
- name: Atualizar cache do apt
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Instalar dependências de base
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates
      - ufw
      - certbot
      - python3-certbot-nginx
    state: present

- name: Docker está instalado?
  ansible.builtin.command: docker --version
  register: docker_check
  changed_when: false
  failed_when: false

- name: Instalar Docker
  # Só quando falta. O servidor já roda o WB-crm em Docker, então na prática
  # esta tarefa não deve disparar — está aqui para o caso de servidor novo.
  ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
  when: docker_check.rc != 0

- name: Garantir que o Docker sobe no boot
  ansible.builtin.systemd:
    name: docker
    enabled: yes
    state: started
