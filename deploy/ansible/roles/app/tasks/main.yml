---
# Setup inicial da aplicação. Atualizações de código do dia a dia rodam pelos
# playbooks quick-deploy / deploy-backend, não por aqui.

- name: Clonar o repositório
  ansible.builtin.git:
    repo: "{{ github_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ github_branch }}"
    accept_hostkey: yes
  environment:
    GIT_TERMINAL_PROMPT: "0"

# ── Env do backend ────────────────────────────────────────────────────────────
# O backend alcança o banco pelo NOME DO CONTAINER, na rede compartilhada.
# host.docker.internal não serve: o Postgres publica só em 127.0.0.1 e esse nome
# resolve para o gateway da bridge (172.17.x), que não alcança o loopback do host.
# A chave do Postiz NÃO vem do vault, por decisão do Bruno em 23/09/2026.
# O objetivo era que um agente conseguisse cadastrá-la sem vault — e isto aqui
# sozinho não resolvia isso, porque exigiria SSH em produção. Quem resolve é
# POST /api/v1/admin/social-engine, que grava no banco e aceita principal de
# máquina. O .env ficou como fallback de bootstrap, e o banco tem precedência.
#
# Isto existe porque o .env é gerado inteiro a cada deploy: sem preservar, um
# valor escrito à mão sobreviveria até o próximo deploy e sumiria sozinho,
# derrubando as rotas sociais para 503 num dia em que ninguém mexeu em nada.
#
# Consequência a lembrar: se a chave for trocada no Postiz, ela precisa ser
# reescrita no servidor. O deploy preserva o que está lá, não busca o valor
# correto — ele não tem como saber que envelheceu.
- name: Ler o .env atual do backend (não existe no primeiro deploy)
  ansible.builtin.slurp:
    src: "{{ app_dir }}/backend/.env"
  register: env_atual
  failed_when: false
  changed_when: false

# splitlines(), não split('\n'): num bloco dobrado (>-) o YAML não processa
# escapes, então o Jinja receberia os dois caracteres barra-n, o split não
# acharia nada, o arquivo inteiro viraria um pedaço só e o match ancorado no
# começo não casaria — devolvendo vazio sem erro nenhum.
- name: Preservar a chave do Postiz escrita à mão no servidor
  ansible.builtin.set_fact:
    postiz_api_key_no_servidor: >-
      {{ (env_atual.content | default('') | b64decode).splitlines()
         | select('match', '^POSTIZ_API_KEY=')
         | map('regex_replace', '^POSTIZ_API_KEY=', '')
         | list | first | default('', true) | trim }}

- name: Avisar quando a chave ainda não foi escrita
  ansible.builtin.debug:
    msg: >-
      POSTIZ_API_KEY vazia no .env. Isto é só o fallback de bootstrap: o
      caminho normal agora é cadastrar pela API, em
      POST /api/v1/admin/social-engine, que grava no banco, vale na hora e tem
      precedência sobre esta variável. Só haverá 503 nas rotas sociais se o
      banco também estiver sem credencial.
  when: postiz_api_key_no_servidor | length == 0

- name: Escrever backend/.env
  ansible.builtin.copy:
    dest: "{{ app_dir }}/backend/.env"
    mode: "0600"
    content: |
      NODE_ENV=production
      PORT=3000
      DATABASE_URL=postgresql://{{ db_user }}:{{ db_password }}@{{ db_container }}:5432/{{ db_name }}
      JWT_SECRET={{ jwt_secret }}
      JWT_ACCESS_EXPIRES_IN=15m
      JWT_REFRESH_EXPIRES_IN=7d
      SEED_ADMIN_EMAIL={{ seed_admin_email }}
      SEED_ADMIN_PASSWORD={{ seed_admin_password }}
      STORAGE_ADAPTER={{ storage_adapter }}
      CALENDAR_ADAPTER={{ calendar_adapter }}
      GOOGLE_CLIENT_ID={{ google_client_id }}
      GOOGLE_CLIENT_SECRET={{ google_client_secret }}
      GOOGLE_REDIRECT_URI={{ google_redirect_uri }}
      FRONTEND_URL={{ public_api_url }}
      TRANSCRIPTOR_BASE_URL={{ transcriptor_base_url }}
      TRANSCRIPTOR_API_KEY={{ transcriptor_api_key }}
      META_SYSTEM_USER_TOKEN={{ meta_system_user_token }}
      META_MOCK_MODE={{ meta_mock_mode }}
      EVOLUTION_API_URL={{ evolution_api_url }}
      EVOLUTION_API_KEY={{ evolution_api_key }}
      EVOLUTION_INSTANCE={{ evolution_instance }}
      POSTIZ_API_URL={{ postiz_api_url }}
      POSTIZ_API_KEY={{ postiz_api_key_no_servidor }}
      CRON_SECRET={{ cron_secret }}
      INTERNAL_API_KEY={{ internal_api_key }}

- name: Escrever frontend/.env.local
  ansible.builtin.copy:
    dest: "{{ app_dir }}/frontend/.env.local"
    mode: "0600"
    content: |
      NEXT_PUBLIC_API_URL={{ public_api_url }}
      NEXT_PUBLIC_POSTIZ_URL={{ postiz_public_url }}

# ── Backend ───────────────────────────────────────────────────────────────────
- name: Construir a imagem do backend
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.prod.yml build backend
    chdir: "{{ app_dir }}"
  timeout: 900

- name: Aplicar as migrations
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.prod.yml run --rm backend pnpm prisma migrate deploy
    chdir: "{{ app_dir }}"
  timeout: 600

- name: Semear o admin
  # O seed é idempotente: cria o admin só se ainda não existir.
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.prod.yml run --rm backend node -r tsconfig-paths/register dist/seed.js
    chdir: "{{ app_dir }}"
  timeout: 300
  register: seed_out
  failed_when: false

- name: Saída do seed
  ansible.builtin.debug:
    msg: "{{ seed_out.stdout_lines | default([]) }}"

- name: Subir o backend
  ansible.builtin.command:
    cmd: docker compose -f docker-compose.prod.yml up -d backend
    chdir: "{{ app_dir }}"
  timeout: 300

# ── Frontend ──────────────────────────────────────────────────────────────────
- name: Instalar dependências do frontend
  ansible.builtin.command:
    cmd: pnpm install --frozen-lockfile
    chdir: "{{ app_dir }}/frontend"
  timeout: 900

- name: Build do Next.js
  ansible.builtin.command:
    cmd: pnpm build
    chdir: "{{ app_dir }}/frontend"
  environment:
    NODE_OPTIONS: "--max-old-space-size=4096"
    NODE_ENV: production
  timeout: 1200

- name: Escrever o ecosystem do PM2
  ansible.builtin.copy:
    dest: "{{ app_dir }}/ecosystem.config.js"
    mode: "0644"
    content: |
      module.exports = {
        apps: [{
          name: '{{ app_name }}',
          cwd: '{{ app_dir }}/frontend',
          // O binário JS de verdade, não node_modules/.bin/next: aquele é um
          // wrapper #!/bin/sh e o PM2, em fork mode, tenta interpretá-lo como
          // JavaScript — dá SyntaxError e o processo entra em loop de restart.
          script: 'node_modules/next/dist/bin/next',
          args: 'start -p {{ frontend_port }}',
          env: { NODE_ENV: 'production' },
          error_file: '/var/log/pm2/{{ app_name }}-error.log',
          out_file: '/var/log/pm2/{{ app_name }}-out.log',
          max_memory_restart: '1G',
        }],
      }

- name: Registrar o app no PM2
  # O delete antes do start também limpa um processo que esteja em loop de
  # restart de uma execução anterior.
  ansible.builtin.shell: |
    pm2 delete {{ app_name }} 2>/dev/null || true
    cd {{ app_dir }} && pm2 start ecosystem.config.js
    pm2 save
  timeout: 300
